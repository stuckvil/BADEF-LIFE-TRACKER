<!DOCTYPE html>
<html>
<head>
    <title>BADEF Life Tracker</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            max-width: 700px;
            margin: 50px auto;
            background: #f4f4f4;
            padding: 20px;
        }

        h1 { color: #333; }
        form { margin-bottom: 20px; }
        input, select, button { padding: 10px; margin: 4px; }
        button { cursor: pointer; }
        li { margin: 15px 0; }
        .completed { text-decoration: line-through; color: green; }
        .priority { font-weight: bold; margin-left: 10px; }
        .due-date { margin-left: 10px; color: #555; }
    </style>

</head>
<body>

    <form method="POST" action="{{ url_for('logout') }}">
        <button type="submit">Logout</button>
    </form>

    <h1>BADEF Life Tracker</h1>
    <p>Track your daily progress!</p>

    <!-- Form for creating a task -->
    <form method="POST">

        <input
            type="text"
            name="task"
            placeholder="Enter a task..."
            required
        >

        <select name="priority">
            <option value="Low">Low Priority</option>
            <option value="Medium" selected>Medium Priority</option>
            <option value="High">High Priority</option>
        </select>

        <label for="due_date">Due date:</label>

        <input
            type="date"
            id="due_date"
            name="due_date"
        >

        <button type="submit">Add Task</button>

    </form>

    <h2>My Tasks</h2>
<ul>
    {% for task in tasks %}
    <li>
        <span class="{{ 'completed' if task.completed else '' }}">
            {{ task.name }}
        </span>

        <span class="priority">
            Priority: {{ task.priority }}
        </span>

        {% if task.due_date %}
            <span class="due-date">
                Due: {{ task.due_date }}
            </span>
        {% endif %}

        <form method="POST"
              action="{{ url_for('complete', task_id=task.id) }}"
              style="display: inline;">
            <button type="submit">
                {% if task.completed %}Undo{% else %}Complete{% endif %}
            </button>
        </form>

        <form method="POST"
              action="{{ url_for('delete', task_id=task.id) }}"
              style="display: inline;">
            <button type="submit">Delete</button>
        </form>
    </li>
    {% else %}
    <li>No tasks yet. Add your first task!</li>
    {% endfor %}
</ul>

</body>
</html>
